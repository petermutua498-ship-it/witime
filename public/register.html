
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | WiTime Billing</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="/register.html" aria-label="WiTime Billing home">
        <img src="/images/logo.png" alt="WiTime logo"
             onerror="this.style.display='none'" />
        <span>WiTime <small>Billing System</small></span>
      </a>

      <div class="auth-heading">
        <p class="eyebrow">GET STARTED</p>
        <h1>Create your account</h1>
        <p>Set up your account to manage your Wi-Fi billing business.</p>
      </div>

      <form id="registerForm">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text"
               placeholder="Your full name" maxlength="100"
               autocomplete="name" required />

        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               placeholder="you@example.com" maxlength="254"
               autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="At least 10 characters"
               minlength="10" maxlength="72"
               autocomplete="new-password" required />

       

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword"
               type="password" placeholder="Enter password again"
               minlength="10" maxlength="72"
               autocomplete="new-password" required />

        <p id="message" class="message" role="alert"></p>

        <button id="registerButton" type="submit">Create Account</button>
      </form>

      <p class="auth-switch">
        Already registered?
        <a href="/login.html">Log in</a>
      </p>

      <p class="footer-note">WiTime Billing · Secure account access</p>
    </section>
  </main>

  <script src="/js/register.js"></script>
</body>
</html>
