
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - WiTime</title>
    <link rel="stylesheet" href="/css/admin-login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">

            <div class="logo">
                <img src="/images/logo.png" alt="WiTime Logo">
                <h2>WiTime</h2>
            </div>

            <h1>Administrator Login</h1>
            <p>Sign in to manage your WiTime network.</p>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loginMessage" role="alert" aria-live="polite"></p>

                <button type="submit" id="loginBtn">
                    Login to Dashboard
                </button>

            </form>

            <p class="login-footer">
                WiTime Network Management
            </p>

        </div>
    </main>

    <script>
    const form = document.getElementById("adminLoginForm");
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginBtn");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        message.textContent = "";
        button.disabled = true;
        button.textContent = "Signing in...";

        try {
            const response = await fetch("/api/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    username: document.getElementById("username").value.trim(),
                    password: document.getElementById("password").value
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Login failed.");
            }

            window.location.href = "/admin/dashboard.html";

        } catch (error) {
            message.textContent = error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Login to Dashboard";
        }
    });
    </script>

</body>
</html>
